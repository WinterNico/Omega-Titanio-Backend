spring.application.name=omega-titanio-backend

# Puerto del backend (el frontend usa 5173)
server.port=8080

# Conexión a MySQL local (usuario y base creados en el paso de DBeaver)
spring.datasource.url=jdbc:mysql://localhost:3306/omega_titanio?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=omega
spring.datasource.password=omega123

# Hibernate crea o actualiza las tablas al arrancar. show-sql muestra el SQL en consola (útil para la presentación).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# JWT (lo usará el Frente 2). La clave debe tener al menos 32 caracteres.
app.jwt.secret=omega-titanio-clave-secreta-cambiar-antes-de-entregar-2026
app.jwt.expiration-ms=3600000